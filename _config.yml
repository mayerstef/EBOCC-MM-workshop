# ----
# Site

title: "EBOCC Marine Mammal Expert Workshop"
description: "Co-designing future marine mammal data flows and collaboration for European biodiversity observation. Brussels and online, 27 November 2026."

# Local preview settings
url: ""
baseurl: ""

google_analytics_key: ""
google_maps_javascript_api_key:
disqus_shortname:

# Replace the template icon with an EBOCC logo when available
logo: /siteicon.png

author:
  name: "EBOCC project team"
  email:
  twitter:

social:
  name: "EBOCC"
  links: []

# ----
# Build

timezone: Europe/Brussels
permalink: pretty

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate
  - jekyll-archives

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - UPDATE_INSTRUCTIONS.txt
  - LICENSE
  - LICENCE

collections:
  attendees:
    _hide_content: true
  organizers:
    _hide_content: true

paginate: 10
paginate_path: "/blog/:num/"

jekyll-archives:
  enabled: ['categories']

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

  - scope:
      type: "posts"
    values:
      layout: "post"
      _options:
        image:
          width: 2000
          height: 1322
          resize_style: cover
        content:
          width: 1500
          height: 2000

  - scope:
      path: "contact-success.html"
    values:
      layout: "page"

  - scope:
      path: ""
      type: "pages"
    values:
      image:
        width: 2000
        height: 1322
        resize_style: cover
      bottom_image:
        width: 2000
        height: 1322
        resize_style: cover

# ----
# CloudCannon

social_icons:
  - Facebook
  - Instagram
  - LinkedIn
  - Twitter
  - YouTube
  - Email
  - RSS

_comments:
  description: "Text shown when sharing the website."
  blurb: "Short biography or description of this participant."
